<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CoCo 2</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <meta name="theme-color" content="#0d0b0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CoCo 2" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0b0a; }
      /* Clear of a phone's notch, status bar (drawn over the page when installed) and home indicator; 0 elsewhere. */
      body {
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .book-hint {
        position: fixed; transform: translateX(-50%); padding: 6px 12px; border-radius: 14px; pointer-events: none;
        background: rgba(18, 14, 10, 0.78); color: #e8dcc0; font: 600 12px/1 Helvetica, Arial, sans-serif;
        letter-spacing: 0.03em; white-space: nowrap; opacity: 0; transition: opacity 0.6s;
      }
      .book-hint.show { opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
